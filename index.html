<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>My Playground</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Playground" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="manifest" href="./manifest.webmanifest" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

    mermaid.initialize({
      startOnLoad: false,
      theme: "default",
      securityLevel: "strict"
    });

    window.mermaid = mermaid;
    window.dispatchEvent(new Event("mermaid-ready"));
  </script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      tab-size: 2;
      -webkit-user-select: text;
      user-select: text;
      resize: none;
      line-height: 1.5;
      font-size: 16px;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    iframe {
      width: 100%;
    }

    .app-height {
      height: 100vh;
      height: 100dvh;
    }

    .hidden {
      display: none !important;
    }

    .markdown-body {
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .markdown-body h1 {
      font-size: 1.7rem;
      font-weight: 700;
      margin: 1rem 0 0.5rem;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.3rem;
    }

    .markdown-body h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 1rem 0 0.5rem;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.2rem;
    }

    .markdown-body h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0.8rem 0 0.4rem;
    }

    .markdown-body p {
      margin: 0.7rem 0;
    }

    .markdown-body ul,
    .markdown-body ol {
      margin: 0.7rem 0;
      padding-left: 1.5rem;
    }

    .markdown-body ul {
      list-style: disc;
    }

    .markdown-body ol {
      list-style: decimal;
    }

    .markdown-body blockquote {
      border-left: 4px solid #cbd5e1;
      padding-left: 1rem;
      color: #475569;
      margin: 1rem 0;
    }

    .markdown-body code {
      background: #f1f5f9;
      padding: 0.15rem 0.35rem;
      border-radius: 0.35rem;
      font-size: 0.9em;
    }

    .markdown-body pre {
      margin: 1rem 0;
      overflow-x: auto;
      border-radius: 0.75rem;
      background: #f8fafc;
    }

    .markdown-body pre code {
      display: block;
      padding: 1rem;
      background: transparent;
      border-radius: 0;
    }

    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
      display: block;
      overflow-x: auto;
      white-space: nowrap;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid #cbd5e1;
      padding: 0.4rem 0.6rem;
    }

    .markdown-body th {
      background: #f1f5f9;
    }

    .mermaid {
      display: flex;
      justify-content: center;
      overflow-x: auto;
      margin: 1rem 0;
      padding: 1rem;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
    }
  </style>
</head>

<body class="bg-slate-100 app-height flex flex-col">
  <div class="flex bg-slate-800 text-white shrink-0 pt-[env(safe-area-inset-top)]">
    <button
      id="btn-html"
      type="button"
      class="px-4 py-3 flex-1 font-bold bg-slate-600"
    >
      HTML Run
    </button>

    <button
      id="btn-md"
      type="button"
      class="px-4 py-3 flex-1 font-bold hover:bg-slate-700"
    >
      Markdown
    </button>
  </div>

  <section id="tab-html" class="flex-1 min-h-0 flex flex-col p-2 gap-2">
    <textarea
      id="html-code"
      class="flex-1 min-h-0 p-3 border rounded shadow-inner bg-white text-sm"
      spellcheck="false"
      autocapitalize="off"
      autocomplete="off"
      autocorrect="off"
      placeholder="Enter HTML / CSS / JS here..."
    ><h1 class="text-2xl font-bold text-blue-500">Hello!</h1>

<p>iframe内でもTailwindが使えます。</p>

<button class="bg-blue-600 text-white px-4 py-2 rounded" onclick="alert('Clicked!')">
  Click me
</button>

<script>
  console.log("Running!");
</script></textarea>

    <button
      id="run-code"
      type="button"
      class="bg-blue-600 text-white py-2 rounded shadow font-bold active:bg-blue-700 shrink-0"
    >
      Run Code
    </button>

    <iframe
      id="output-frame"
      title="HTML output"
      class="flex-1 min-h-0 bg-white border rounded"
      sandbox="allow-scripts allow-forms allow-modals allow-popups"
    ></iframe>
  </section>

  <section id="tab-md" class="hidden flex-1 min-h-0 flex flex-col p-2 gap-2">
    <textarea
      id="md-input"
      class="flex-1 min-h-0 p-3 border rounded shadow-inner bg-white text-sm"
      spellcheck="false"
      autocapitalize="off"
      autocomplete="off"
      autocorrect="off"
      placeholder="Enter Markdown here..."
    ># Markdown Preview

## コードブロック

```javascript
const message = "Hello World";
console.log(message);
```

## 表

| Area | Value |
|---|---:|
| Tokyo | 100 |
| Osaka | 80 |

## Mermaid

```mermaid
graph TD
  A[Start] --> B{Check}
  B -->|OK| C[Run]
  B -->|NG| D[Fix]
```
</textarea>

    <div
      id="md-preview"
      class="flex-1 min-h-0 overflow-auto p-4 bg-white border rounded markdown-body"
    ></div>
  </section>

  <script>
    const htmlTab = document.getElementById("tab-html");
    const mdTab = document.getElementById("tab-md");

    const htmlButton = document.getElementById("btn-html");
    const mdButton = document.getElementById("btn-md");

    const htmlCode = document.getElementById("html-code");
    const outputFrame = document.getElementById("output-frame");
    const runButton = document.getElementById("run-code");

    const mdInput = document.getElementById("md-input");
    const mdPreview = document.getElementById("md-preview");

    const STORAGE_KEYS = {
      html: "my-playground-html",
      md: "my-playground-md"
    };

    const savedHtml = localStorage.getItem(STORAGE_KEYS.html);
    const savedMd = localStorage.getItem(STORAGE_KEYS.md);

    if (savedHtml !== null) {
      htmlCode.value = savedHtml;
    }

    if (savedMd !== null) {
      mdInput.value = savedMd;
    }

    function showTab(name) {
      const isHtml = name === "html";

      htmlTab.classList.toggle("hidden", !isHtml);
      mdTab.classList.toggle("hidden", isHtml);

      htmlButton.classList.toggle("bg-slate-600", isHtml);
      mdButton.classList.toggle("bg-slate-600", !isHtml);

      htmlButton.classList.toggle("hover:bg-slate-700", !isHtml);
      mdButton.classList.toggle("hover:bg-slate-700", isHtml);
    }

    function buildIframeDocument(source) {
      const trimmed = source.trim();

      if (/^<!doctype html>/i.test(trimmed) || /<html[\s>]/i.test(trimmed)) {
        return source;
      }

      return `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"><\/script>
  <style>
    body {
      padding: 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
${source}
</body>
</html>`;
    }

    function runCode() {
      const source = htmlCode.value;
      localStorage.setItem(STORAGE_KEYS.html, source);
      outputFrame.srcdoc = buildIframeDocument(source);
    }

    async function renderMarkdown() {
      const source = mdInput.value;
      localStorage.setItem(STORAGE_KEYS.md, source);

      if (!window.marked || !window.hljs) {
        mdPreview.textContent = "Markdownライブラリの読み込み中です。";
        return;
      }

      mdPreview.innerHTML = marked.parse(source, {
        gfm: true,
        breaks: true
      });

      const codeBlocks = mdPreview.querySelectorAll("pre code");

      codeBlocks.forEach((code) => {
        const className = code.className || "";
        const isMermaid =
          className.includes("language-mermaid") ||
          className.includes("lang-mermaid");

        if (isMermaid) {
          const pre = code.parentElement;
          const div = document.createElement("div");

          div.className = "mermaid";
          div.textContent = code.textContent;

          pre.replaceWith(div);
        }
      });

      mdPreview.querySelectorAll("pre code").forEach((block) => {
        hljs.highlightElement(block);
      });

      if (window.mermaid) {
        try {
          await window.mermaid.run({
            nodes: mdPreview.querySelectorAll(".mermaid")
          });
        } catch (error) {
          console.error(error);

          const message = document.createElement("div");
          message.className =
            "my-3 rounded border border-red-300 bg-red-50 p-3 text-sm text-red-700";
          message.textContent =
            "Mermaidの描画に失敗しました。構文を確認してください。";

          mdPreview.prepend(message);
        }
      }
    }

    function debounce(fn, delay) {
      let timerId;

      return (...args) => {
        clearTimeout(timerId);
        timerId = setTimeout(() => fn(...args), delay);
      };
    }

    htmlButton.addEventListener("click", () => showTab("html"));

    mdButton.addEventListener("click", () => {
      showTab("md");
      renderMarkdown();
    });

    runButton.addEventListener("click", runCode);

    htmlCode.addEventListener("input", () => {
      localStorage.setItem(STORAGE_KEYS.html, htmlCode.value);
    });

    mdInput.addEventListener("input", debounce(renderMarkdown, 250));

    window.addEventListener("mermaid-ready", renderMarkdown);

    showTab("html");
    runCode();
    renderMarkdown();
  </script>
</body>
</html>
