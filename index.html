<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Playground</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Playground" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="./security_patch.js"></script>
  <script type="importmap">
    {
      "imports": {
        "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs": "https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.esm.min.mjs"
      }
    }
  </script>
  <script type="module" src="./app.js"></script>
  <script defer src="./patch.js"></script>
  <script defer src="./patch_math_block.js"></script>
  <script defer src="./patch_json.js"></script>
</head>
<body class="bg-slate-100 app-height flex flex-col">
  <div class="flex bg-slate-800 text-white shrink-0 pt-[env(safe-area-inset-top)]">
    <button id="btn-pen" type="button" class="px-4 py-3 flex-1 font-bold bg-slate-600">Code Run</button>
    <button id="btn-md" type="button" class="px-4 py-3 flex-1 font-bold hover:bg-slate-700">Markdown</button>
  </div>

  <section id="tab-pen" class="flex-1 min-h-0 flex flex-col p-2 gap-2">
    <div class="grid grid-cols-4 gap-1 shrink-0">
      <button id="editor-tab-html" type="button" class="editor-tab-active rounded px-2 py-2 text-sm font-bold">HTML</button>
      <button id="editor-tab-css" type="button" class="editor-tab-inactive rounded px-2 py-2 text-sm font-bold">CSS</button>
      <button id="editor-tab-js" type="button" class="editor-tab-inactive rounded px-2 py-2 text-sm font-bold">JS</button>
      <button id="editor-tab-preview" type="button" class="editor-tab-inactive rounded px-2 py-2 text-sm font-bold">Preview</button>
    </div>

    <details id="code-tools" class="tool-details shrink-0">
      <summary>Code tools</summary>
      <div class="grid grid-cols-2 gap-1 mt-2">
        <select id="project-select" class="rounded border border-slate-300 bg-white px-2 py-2 text-sm"></select>
        <input id="project-name" class="rounded border border-slate-300 bg-white px-2 py-2 text-sm" placeholder="Project name" />
      </div>
      <div class="grid grid-cols-4 gap-1 mt-1">
        <button id="new-project" type="button" class="tool-button">New</button>
        <button id="save-project" type="button" class="tool-button">Save</button>
        <button id="delete-project" type="button" class="tool-button">Delete</button>
        <button id="reset-sample" type="button" class="tool-button">Sample</button>
      </div>
      <div class="grid grid-cols-4 gap-1 mt-1">
        <button id="copy-html" type="button" class="tool-button">Copy</button>
        <button id="export-html" type="button" class="tool-button">Export</button>
        <button id="font-smaller" type="button" class="tool-button">A-</button>
        <button id="font-larger" type="button" class="tool-button">A+</button>
      </div>
    </details>

    <div id="status-text" class="hidden status shrink-0"></div>

    <div id="editor-panel" class="flex-1 min-h-0 flex flex-col">
      <textarea id="html-code" class="flex-1 min-h-0 p-3 border rounded shadow-inner bg-white text-sm" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="HTML body here..."></textarea>
      <textarea id="css-code" class="hidden flex-1 min-h-0 p-3 border rounded shadow-inner bg-white text-sm" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="CSS here..."></textarea>
      <textarea id="js-code" class="hidden flex-1 min-h-0 p-3 border rounded shadow-inner bg-white text-sm" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="JavaScript here..."></textarea>
    </div>

    <div id="preview-panel" class="hidden flex-1 min-h-0 flex flex-col gap-2">
      <div class="grid grid-cols-4 gap-1 shrink-0">
        <button id="code-zoom-out" type="button" class="tool-button">−</button>
        <button id="code-zoom-reset" type="button" class="tool-button">100%</button>
        <button id="code-zoom-in" type="button" class="tool-button">＋</button>
        <div id="code-zoom-label" class="rounded border bg-white px-2 py-2 text-center text-xs font-bold text-slate-700">100%</div>
      </div>
      <div id="output-shell" class="preview-shell">
        <iframe id="output-frame" title="Code output" class="code-frame" sandbox="allow-scripts allow-forms allow-modals"></iframe>
      </div>
      <div class="h-28 shrink-0 rounded bg-slate-950 text-xs text-slate-100 flex flex-col">
        <div class="flex items-center justify-between border-b border-slate-700 px-2 py-1 text-slate-300">
          <span>Console</span>
          <button id="clear-console" type="button" class="rounded bg-slate-700 px-2 py-1 text-xs text-white">Clear</button>
        </div>
        <div id="console-output" class="flex-1 overflow-auto px-2 py-1"></div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2 shrink-0 pb-[env(safe-area-inset-bottom)]">
      <button id="run-code" type="button" class="bg-blue-600 text-white py-2 rounded shadow font-bold active:bg-blue-700">Run</button>
      <label class="flex items-center justify-center gap-2 rounded bg-white border text-sm font-bold"><input id="auto-run" type="checkbox" checked />Auto</label>
      <label class="flex items-center justify-center gap-2 rounded bg-white border text-sm font-bold"><input id="include-tailwind" type="checkbox" />Tailwind</label>
    </div>
  </section>

  <section id="tab-md" class="hidden flex-1 min-h-0 flex flex-col p-2 gap-2">
    <div class="grid grid-cols-3 gap-1 shrink-0">
      <button id="md-mode-edit" type="button" class="mode-active rounded px-2 py-2 text-sm font-bold">Edit</button>
      <button id="md-mode-split" type="button" class="mode-inactive rounded px-2 py-2 text-sm font-bold">Split</button>
      <button id="md-mode-preview" type="button" class="mode-inactive rounded px-2 py-2 text-sm font-bold">Preview</button>
    </div>

    <details id="md-tools" class="tool-details shrink-0">
      <summary>Markdown tools</summary>
      <div class="md-toolbar mt-2">
        <button id="md-h1" type="button" class="tool-button">H1</button>
        <button id="md-h2" type="button" class="tool-button">H2</button>
        <button id="md-bold" type="button" class="tool-button">Bold</button>
        <button id="md-italic" type="button" class="tool-button">Italic</button>
      </div>
      <div class="md-toolbar mt-1">
        <button id="md-code" type="button" class="tool-button">Code</button>
        <button id="md-table" type="button" class="tool-button">Table</button>
        <button id="md-mermaid" type="button" class="tool-button">Mermaid</button>
        <button id="md-toc" type="button" class="tool-button">TOC</button>
      </div>
      <div class="md-toolbar mt-1">
        <button id="md-copy" type="button" class="tool-button">Copy MD</button>
        <button id="md-copy-html" type="button" class="tool-button">Copy HTML</button>
        <button id="md-export" type="button" class="tool-button">Export MD</button>
        <button id="md-export-html" type="button" class="tool-button">Export HTML</button>
      </div>
      <div class="md-toolbar mt-1">
        <button id="md-sample" type="button" class="tool-button">Sample</button>
        <button id="md-clear" type="button" class="tool-button">Clear</button>
        <button id="md-font-smaller" type="button" class="tool-button">A-</button>
        <button id="md-font-larger" type="button" class="tool-button">A+</button>
      </div>
      <div id="md-zoom-source" class="md-toolbar mt-1">
        <button id="md-preview-zoom-out" type="button" class="tool-button">−</button>
        <button id="md-preview-zoom-reset" type="button" class="tool-button">100%</button>
        <button id="md-preview-zoom-in" type="button" class="tool-button">＋</button>
        <div id="md-preview-zoom-label" class="rounded border bg-white px-2 py-2 text-center text-xs font-bold text-slate-700">100%</div>
      </div>
    </details>

    <div id="md-preview-zoom-bar" class="hidden md-toolbar shrink-0"></div>
    <div id="md-stats" class="shrink-0 rounded bg-white border border-slate-200 px-2 py-1 text-xs text-slate-600"></div>
    <div id="md-status" class="hidden status shrink-0"></div>

    <div id="md-workspace" class="flex-1 min-h-0 md-workspace-edit-only gap-2">
      <textarea id="md-input" class="flex-1 min-h-0 p-3 border rounded shadow-inner bg-white text-sm" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Enter Markdown here..."></textarea>
      <div id="md-preview-shell" class="hidden preview-shell">
        <div id="md-preview" class="markdown-body p-4"></div>
      </div>
    </div>
  </section>
</body>
</html>
