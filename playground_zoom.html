    const DEFAULT_MARKDOWN=['# Markdown Lab','','スマホでMarkdownを書きながら、プレビュー・Mermaid・コードハイライト・HTML書き出しを確認できます。','','## チェックリスト','','- [x] Markdownを書く','- [x] Previewする','- [ ] HTMLとしてExportする','','## コード','','```javascript','const message = "Hello Markdown";','console.log(message);','```','','## 表','','| Area | Value |','|---|---:|','| Tokyo | 100 |','| Osaka | 80 |','','## Mermaid','','```mermaid','graph TD','  A[Idea] --> B[Write]','  B --> C[Preview]','  C --> D[Export]','```'].join('\n');
    const $=(id)=>document.getElementById(id);const penTab=$('tab-pen'),mdTab=$('tab-md'),penButton=$('btn-pen'),mdButton=$('btn-md');const projectSelect=$('project-select'),projectNameInput=$('project-name');const htmlCode=$('html-code'),cssCode=$('css-code'),jsCode=$('js-code'),allCodeTextareas=[htmlCode,cssCode,jsCode];const editorPanel=$('editor-panel'),previewPanel=$('preview-panel'),outputFrame=$('output-frame'),outputSurface=$('output-surface'),codeZoomLabel=$('code-zoom-label');const runButton=$('run-code'),autoRun=$('auto-run'),includeTailwind=$('include-tailwind'),consoleOutput=$('console-output');const statusText=$('status-text');const mdInput=$('md-input'),mdPreview=$('md-preview'),mdPreviewShell=$('md-preview-shell'),mdWorkspace=$('md-workspace'),mdStats=$('md-stats'),mdStatus=$('md-status'),mdPreviewZoomLabel=$('md-preview-zoom-label');const editorTabButtons={html:$('editor-tab-html'),css:$('editor-tab-css'),js:$('editor-tab-js'),preview:$('editor-tab-preview')};const mdModeButtons={edit:$('md-mode-edit'),split:$('md-mode-split'),preview:$('md-mode-preview')};
    const STORAGE_KEYS={projects:'my-playground-projects-v4',activeProjectId:'my-playground-active-project-id-v4',md:'my-playground-md',mdMode:'my-playground-md-mode',mdFontSize:'my-playground-md-font-size',mdPreviewZoom:'my-playground-md-preview-zoom',codePreviewZoom:'my-playground-code-preview-zoom',activeEditor:'my-playground-active-editor',autoRun:'my-playground-auto-run',includeTailwind:'my-playground-include-tailwind',editorFontSize:'my-playground-editor-font-size'};
    let statusTimer=null,mdStatusTimer=null,projects=loadProjects(),activeProjectId=localStorage.getItem(STORAGE_KEYS.activeProjectId)||projects[0].id,editorFontSize=Number(localStorage.getItem(STORAGE_KEYS.editorFontSize)||'16'),mdMode=localStorage.getItem(STORAGE_KEYS.mdMode)||'edit',mdFontSize=Number(localStorage.getItem(STORAGE_KEYS.mdFontSize)||'16'),codePreviewZoom=Number(localStorage.getItem(STORAGE_KEYS.codePreviewZoom)||'1'),mdPreviewZoom=Number(localStorage.getItem(STORAGE_KEYS.mdPreviewZoom)||'1');if(!projects.some(p=>p.id===activeProjectId))activeProjectId=projects[0].id;mdInput.value=localStorage.getItem(STORAGE_KEYS.md)??DEFAULT_MARKDOWN;const savedActiveEditor=localStorage.getItem(STORAGE_KEYS.activeEditor),savedAutoRun=localStorage.getItem(STORAGE_KEYS.autoRun),savedIncludeTailwind=localStorage.getItem(STORAGE_KEYS.includeTailwind);if(savedAutoRun!==null)autoRun.checked=savedAutoRun==='true';if(savedIncludeTailwind!==null)includeTailwind.checked=savedIncludeTailwind==='true';
    function makeId(){return'p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}function createProject(o={}){return{id:makeId(),name:o.name||DEFAULT_PROJECT.name,html:o.html??DEFAULT_PROJECT.html,css:o.css??DEFAULT_PROJECT.css,js:o.js??DEFAULT_PROJECT.js,updatedAt:Date.now()}}function loadProjects(){try{const raw=localStorage.getItem(STORAGE_KEYS.projects);if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed)&&parsed.length>0)return parsed}}catch(e){}return[createProject({name:'Scratch'})]}function saveProjects(){localStorage.setItem(STORAGE_KEYS.projects,JSON.stringify(projects));localStorage.setItem(STORAGE_KEYS.activeProjectId,activeProjectId)}function getActiveProject(){return projects.find(p=>p.id===activeProjectId)||projects[0]}function captureEditorsToActiveProject(){const p=getActiveProject();p.name=projectNameInput.value.trim()||'Untitled';p.html=htmlCode.value;p.css=cssCode.value;p.js=jsCode.value;p.updatedAt=Date.now();saveProjects()}function loadProjectIntoEditors(p){activeProjectId=p.id;projectNameInput.value=p.name||'Untitled';htmlCode.value=p.html||'';cssCode.value=p.css||'';jsCode.value=p.js||'';saveProjects();renderProjectSelect()}function renderProjectSelect(){projectSelect.innerHTML='';projects.slice().sort((a,b)=>b.updatedAt-a.updatedAt).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name||'Untitled';o.selected=p.id===activeProjectId;projectSelect.appendChild(o)})}function notify(m){clearTimeout(statusTimer);statusText.textContent=m;statusText.classList.remove('hidden');statusTimer=setTimeout(()=>statusText.classList.add('hidden'),1800)}function notifyMd(m){clearTimeout(mdStatusTimer);mdStatus.textContent=m;mdStatus.classList.remove('hidden');mdStatusTimer=setTimeout(()=>mdStatus.classList.add('hidden'),1800)}function clampZoom(z){return Math.max(.25,Math.min(3,Math.round(z*100)/100))}

    function showMainTab(name){const isPen=name==='pen';penTab.classList.toggle('hidden',!isPen);mdTab.classList.toggle('hidden',isPen);penButton.classList.toggle('bg-slate-600',isPen);mdButton.classList.toggle('bg-slate-600',!isPen);if(!isPen)renderMarkdown()}function showEditorTab(name){const isPreview=name==='preview';htmlCode.classList.toggle('hidden',name!=='html');cssCode.classList.toggle('hidden',name!=='css');jsCode.classList.toggle('hidden',name!=='js');editorPanel.classList.toggle('hidden',isPreview);previewPanel.classList.toggle('hidden',!isPreview);Object.keys(editorTabButtons).forEach(k=>{const a=k===name;editorTabButtons[k].classList.toggle('editor-tab-active',a);editorTabButtons[k].classList.toggle('editor-tab-inactive',!a)});localStorage.setItem(STORAGE_KEYS.activeEditor,name);if(isPreview)runCode(false)}function setMarkdownMode(mode){mdMode=mode;localStorage.setItem(STORAGE_KEYS.mdMode,mode);mdWorkspace.classList.remove('md-workspace-edit-only','md-workspace-preview-only','md-workspace-split');mdInput.classList.toggle('hidden',mode==='preview');mdPreviewShell.classList.toggle('hidden',mode==='edit');if(mode==='split')mdWorkspace.classList.add('md-workspace-split');if(mode==='edit')mdWorkspace.classList.add('md-workspace-edit-only');if(mode==='preview')mdWorkspace.classList.add('md-workspace-preview-only');Object.keys(mdModeButtons).forEach(k=>{const a=k===mode;mdModeButtons[k].classList.toggle('mode-active',a);mdModeButtons[k].classList.toggle('mode-inactive',!a)});if(mode!=='edit')renderMarkdown()}

    function updateMdStats(){const text=mdInput.value;const chars=text.length,noSpace=text.replace(/\s/g,'').length,words=(text.trim().match(/[A-Za-z0-9_]+|[\u3040-\u30ff\u3400-\u9fff]+/g)||[]).length,headings=(text.match(/^#{1,6}\s+/gm)||[]).length;mdStats.textContent='文字: '+chars+' / 空白除く: '+noSpace+' / 語句: '+words+' / 見出し: '+headings+' / font: '+mdFontSize+'px'}function slugify(text){return text.toLowerCase().trim().replace(/[^\w\u3040-\u30ff\u3400-\u9fff\s-]/g,'').replace(/\s+/g,'-').slice(0,80)}function addHeadingAnchors(){const used={};mdPreview.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{let id=slugify(h.textContent||'heading')||'heading';used[id]=(used[id]||0)+1;if(used[id]>1)id+='-'+used[id];h.id=id})}async function renderMarkdown(){const source=mdInput.value;localStorage.setItem(STORAGE_KEYS.md,source);updateMdStats();if(!window.marked||!window.hljs){mdPreview.textContent='Markdownライブラリの読み込み中です。';return}mdPreview.innerHTML=marked.parse(source,{gfm:true,breaks:true});mdPreview.querySelectorAll('pre code').forEach(code=>{const c=code.className||'';if(c.includes('language-mermaid')||c.includes('lang-mermaid')){const pre=code.parentElement,div=document.createElement('div');div.className='mermaid';div.textContent=code.textContent;pre.replaceWith(div)}});mdPreview.querySelectorAll('pre code').forEach(block=>hljs.highlightElement(block));addHeadingAnchors();applyMdPreviewZoom();if(window.mermaid){try{await window.mermaid.run({nodes:mdPreview.querySelectorAll('.mermaid')})}catch(e){const msg=document.createElement('div');msg.className='my-3 rounded border border-red-300 bg-red-50 p-3 text-sm text-red-700';msg.textContent='Mermaidの描画に失敗しました。構文を確認してください。';mdPreview.prepend(msg)}}}const renderMarkdownDebounced=debounce(renderMarkdown,250);
    function getSelectionInfo(){return{start:mdInput.selectionStart||0,end:mdInput.selectionEnd||0,value:mdInput.value}}function replaceSelection(text,selectStartOffset,selectEndOffset){const s=getSelectionInfo();mdInput.value=s.value.slice(0,s.start)+text+s.value.slice(s.end);const base=s.start;mdInput.focus();if(selectStartOffset!==undefined&&selectEndOffset!==undefined)mdInput.setSelectionRange(base+selectStartOffset,base+selectEndOffset);else mdInput.setSelectionRange(base+text.length,base+text.length);renderMarkdownDebounced()}function wrapSelection(prefix,suffix,placeholder){const s=getSelectionInfo(),selected=s.value.slice(s.start,s.end)||placeholder;replaceSelection(prefix+selected+suffix,prefix.length,prefix.length+selected.length)}function prefixCurrentLine(prefix){const s=getSelectionInfo(),lineStart=s.value.lastIndexOf('\n',s.start-1)+1;mdInput.value=s.value.slice(0,lineStart)+prefix+s.value.slice(lineStart);mdInput.focus();mdInput.setSelectionRange(s.start+prefix.length,s.end+prefix.length);renderMarkdownDebounced()}function insertBlock(block){const s=getSelectionInfo(),needsBefore=s.start>0&&s.value[s.start-1]!=='\n',needsAfter=s.end<s.value.length&&s.value[s.end]!=='\n';replaceSelection((needsBefore?'\n':'')+block+(needsAfter?'\n':''))}function buildToc(){const items=[];mdInput.value.split('\n').forEach(line=>{const m=line.match(/^(#{1,6})\s+(.+)$/);if(!m)return;const level=m[1].length,title=m[2].replace(/#+\s*$/,'').trim(),indent='  '.repeat(Math.max(0,level-1));items.push(indent+'- ['+title+'](#'+slugify(title)+')')});return items.length?'## 目次\n\n'+items.join('\n')+'\n':'## 目次\n\n- 見出しがありません\n'}function getMarkdownHtmlDocument(){return'<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>Markdown Export</title>\n<style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7;max-width:820px;margin:0 auto;padding:24px;color:#0f172a}.markdown-body pre{overflow:auto;background:#f8fafc;border-radius:12px;padding:12px}.markdown-body code{background:#f1f5f9;padding:.15rem .35rem;border-radius:.35rem}.markdown-body pre code{background:transparent;padding:0}.markdown-body table{border-collapse:collapse;width:100%;display:block;overflow:auto}.markdown-body th,.markdown-body td{border:1px solid #cbd5e1;padding:.4rem .6rem}.markdown-body th{background:#f1f5f9}.mermaid{display:flex;justify-content:center;overflow:auto;margin:1rem 0;padding:1rem;border:1px solid #e5e7eb;border-radius:12px}</style>\n</head>\n<body>\n<article class="markdown-body">\n'+mdPreview.innerHTML+'\n</article>\n</body>\n</html>'}async function copyMarkdown(){try{await navigator.clipboard.writeText(mdInput.value);notifyMd('Markdownをコピーしました')}catch(e){notifyMd('コピーできませんでした')}}async function copyMarkdownHtml(){await renderMarkdown();try{await navigator.clipboard.writeText(getMarkdownHtmlDocument());notifyMd('HTMLをコピーしました')}catch(e){notifyMd('コピーできませんでした')}}
