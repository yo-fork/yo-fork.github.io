<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Playground</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Playground" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" });
    window.mermaid = mermaid;
    window.dispatchEvent(new Event("mermaid-ready"));
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
    textarea, input, select { font-size: 16px; }
    textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; tab-size: 2; -webkit-user-select: text; user-select: text; resize: none; line-height: 1.5; }
    button, label, input, select { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    iframe { width: 100%; }
    .app-height { height: 100vh; height: 100dvh; }
    .hidden { display: none !important; }
    .editor-tab-active { background: #2563eb; color: white; }
    .editor-tab-inactive { background: #e2e8f0; color: #0f172a; }
    .tool-button { border-radius: .5rem; border: 1px solid #cbd5e1; background: white; padding: .45rem .35rem; font-size: .78rem; font-weight: 700; color: #0f172a; }
    .tool-button:active { background: #e2e8f0; }
    .console-line { border-bottom: 1px solid #1e293b; padding: .25rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .console-log { color: #e5e7eb; }
    .console-warn { color: #fde68a; }
    .console-error { color: #fecaca; }
    .markdown-body { line-height: 1.7; overflow-wrap: anywhere; }
    .markdown-body h1 { font-size: 1.7rem; font-weight: 700; margin: 1rem 0 .5rem; border-bottom: 1px solid #e5e7eb; padding-bottom: .3rem; }
    .markdown-body h2 { font-size: 1.35rem; font-weight: 700; margin: 1rem 0 .5rem; border-bottom: 1px solid #e5e7eb; padding-bottom: .2rem; }
    .markdown-body h3 { font-size: 1.15rem; font-weight: 700; margin: .8rem 0 .4rem; }
    .markdown-body p { margin: .7rem 0; }
    .markdown-body ul, .markdown-body ol { margin: .7rem 0; padding-left: 1.5rem; }
    .markdown-body ul { list-style: disc; }
    .markdown-body ol { list-style: decimal; }
    .markdown-body code { background: #f1f5f9; padding: .15rem .35rem; border-radius: .35rem; font-size: .9em; }
    .markdown-body pre { margin: 1rem 0; overflow-x: auto; border-radius: .75rem; background: #f8fafc; }
    .markdown-body pre code { display: block; padding: 1rem; background: transparent; border-radius: 0; }
    .markdown-body table { border-collapse: collapse; width: 100%; margin: 1rem 0; display: block; overflow-x: auto; white-space: nowrap; }
    .markdown-body th, .markdown-body td { border: 1px solid #cbd5e1; padding: .4rem .6rem; }
    .markdown-body th { background: #f1f5f9; }
    .mermaid { display: flex; justify-content: center; overflow-x: auto; margin: 1rem 0; padding: 1rem; background: white; border: 1px solid #e5e7eb; border-radius: .75rem; }
  </style>
</head>
<body class="bg-slate-100 app-height flex flex-col">
  <div class="flex bg-slate-800 text-white shrink-0 pt-[env(safe-area-inset-top)]">
    <button id="btn-pen" type="button" class="px-4 py-3 flex-1 font-bold bg-slate-600">Code Run</button>
    <button id="btn-md" type="button" class="px-4 py-3 flex-1 font-bold hover:bg-slate-700">Markdown</button>
  </div>

  <section id="tab-pen" class="flex-1 min-h-0 flex flex-col p-2 gap-2">
    <div class="grid grid-cols-4 gap-1 shrink-0">
      <button id="editor-tab-html" type="button" class="editor-tab-active rounded px-2 py-2 text-sm font-bold">HTML</button>
      <button id="editor-tab-css" type="button" class="editor-tab-inactive rounded px-2 py-2 text-sm font-bold">CSS</button>
      <button id="editor-tab-js" type="button" class="editor-tab-inactive rounded px-2 py-2 text-sm font-bold">JS</button>
      <button id="editor-tab-preview" type="button" class="editor-tab-inactive rounded px-2 py-2 text-sm font-bold">Preview</button>
    </div>
    <div class="grid grid-cols-2 gap-1 shrink-0">
      <select id="project-select" class="rounded border border-slate-300 bg-white px-2 py-2 text-sm"></select>
      <input id="project-name" class="rounded border border-slate-300 bg-white px-2 py-2 text-sm" placeholder="Project name" />
    </div>
    <div class="grid grid-cols-4 gap-1 shrink-0">
      <button id="new-project" type="button" class="tool-button">New</button>
      <button id="save-project" type="button" class="tool-button">Save</button>
      <button id="delete-project" type="button" class="tool-button">Delete</button>
      <button id="reset-sample" type="button" class="tool-button">Sample</button>
    </div>
    <div class="grid grid-cols-4 gap-1 shrink-0">
      <button id="copy-html" type="button" class="tool-button">Copy</button>
      <button id="export-html" type="button" class="tool-button">Export</button>
      <button id="font-smaller" type="button" class="tool-button">A-</button>
      <button id="font-larger" type="button" class="tool-button">A+</button>
    </div>
    <div id="status-text" class="hidden shrink-0 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-xs text-emerald-800"></div>
    <div id="editor-panel" class="flex-1 min-h-0 flex flex-col">
      <textarea id="html-code" class="flex-1 min-h-0 p-3 border rounded shadow-inner bg-white text-sm" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="HTML body here..."></textarea>
      <textarea id="css-code" class="hidden flex-1 min-h-0 p-3 border rounded shadow-inner bg-white text-sm" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="CSS here..."></textarea>
      <textarea id="js-code" class="hidden flex-1 min-h-0 p-3 border rounded shadow-inner bg-white text-sm" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="JavaScript here..."></textarea>
    </div>
    <div id="preview-panel" class="hidden flex-1 min-h-0 flex flex-col gap-2">
      <iframe id="output-frame" title="Code output" class="flex-1 min-h-0 bg-white border rounded" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
      <div class="h-28 shrink-0 rounded bg-slate-950 text-xs text-slate-100 flex flex-col">
        <div class="flex items-center justify-between border-b border-slate-700 px-2 py-1 text-slate-300">
          <span>Console</span>
          <button id="clear-console" type="button" class="rounded bg-slate-700 px-2 py-1 text-xs text-white">Clear</button>
        </div>
        <div id="console-output" class="flex-1 overflow-auto px-2 py-1"></div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-2 shrink-0 pb-[env(safe-area-inset-bottom)]">
      <button id="run-code" type="button" class="bg-blue-600 text-white py-2 rounded shadow font-bold active:bg-blue-700">Run</button>
      <label class="flex items-center justify-center gap-2 rounded bg-white border text-sm font-bold"><input id="auto-run" type="checkbox" checked />Auto</label>
      <label class="flex items-center justify-center gap-2 rounded bg-white border text-sm font-bold"><input id="include-tailwind" type="checkbox" />Tailwind</label>
    </div>
  </section>

  <section id="tab-md" class="hidden flex-1 min-h-0 flex flex-col p-2 gap-2">
    <textarea id="md-input" class="flex-1 min-h-0 p-3 border rounded shadow-inner bg-white text-sm" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Enter Markdown here..."># Markdown Preview

const message = "Hello World";
console.log(message);
```

</textarea>
    <div id="md-preview" class="flex-1 min-h-0 overflow-auto p-4 bg-white border rounded markdown-body"></div>
  </section>

  <script>
    const DEFAULT_PROJECT = {
      name: "Scratch",
      html: ['<main class="card">','  <h1>CodePen風 Playground</h1>','  <p>HTML / CSS / JS を別々に書いて実行できます。</p>','  <button id="count-button">Count: 0</button>','</main>'].join('\n'),
      css: ['body {','  min-height: 100vh;','  display: grid;','  place-items: center;','  margin: 0;','  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;','  background: linear-gradient(135deg, #dbeafe, #f8fafc);','}','','.card {','  width: min(90vw, 420px);','  padding: 24px;','  border-radius: 20px;','  background: white;','  box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);','  text-align: center;','}','','h1 {','  margin-top: 0;','  color: #1d4ed8;','}','','button {','  border: 0;','  border-radius: 999px;','  padding: 12px 18px;','  color: white;','  background: #2563eb;','  font-weight: 700;','}'].join('\n'),
      js: ['let count = 0;','const button = document.getElementById("count-button");','','button.addEventListener("click", function () {','  count += 1;','  button.textContent = "Count: " + count;','  console.log("count", count);','});'].join('\n')
    };

    const $ = (id) => document.getElementById(id);
    const penTab = $('tab-pen'), mdTab = $('tab-md'), penButton = $('btn-pen'), mdButton = $('btn-md');
    const projectSelect = $('project-select'), projectNameInput = $('project-name');
    const newProjectButton = $('new-project'), saveProjectButton = $('save-project'), deleteProjectButton = $('delete-project'), resetSampleButton = $('reset-sample');
    const copyHtmlButton = $('copy-html'), exportHtmlButton = $('export-html'), fontSmallerButton = $('font-smaller'), fontLargerButton = $('font-larger'), statusText = $('status-text');
    const editorPanel = $('editor-panel'), previewPanel = $('preview-panel');
    const editorTabButtons = { html: $('editor-tab-html'), css: $('editor-tab-css'), js: $('editor-tab-js'), preview: $('editor-tab-preview') };
    const htmlCode = $('html-code'), cssCode = $('css-code'), jsCode = $('js-code'), allCodeTextareas = [htmlCode, cssCode, jsCode];
    const outputFrame = $('output-frame'), runButton = $('run-code'), autoRun = $('auto-run'), includeTailwind = $('include-tailwind'), consoleOutput = $('console-output'), clearConsoleButton = $('clear-console');
    const mdInput = $('md-input'), mdPreview = $('md-preview');

    const STORAGE_KEYS = { projects: 'my-playground-projects-v3', activeProjectId: 'my-playground-active-project-id-v3', md: 'my-playground-md', activeEditor: 'my-playground-active-editor', autoRun: 'my-playground-auto-run', includeTailwind: 'my-playground-include-tailwind', editorFontSize: 'my-playground-editor-font-size' };
    let statusTimer = null, projects = loadProjects(), activeProjectId = localStorage.getItem(STORAGE_KEYS.activeProjectId) || projects[0].id, editorFontSize = Number(localStorage.getItem(STORAGE_KEYS.editorFontSize) || '16');
    if (!projects.some((p) => p.id === activeProjectId)) activeProjectId = projects[0].id;
    const savedMd = localStorage.getItem(STORAGE_KEYS.md), savedActiveEditor = localStorage.getItem(STORAGE_KEYS.activeEditor), savedAutoRun = localStorage.getItem(STORAGE_KEYS.autoRun), savedIncludeTailwind = localStorage.getItem(STORAGE_KEYS.includeTailwind);
    if (savedMd !== null) mdInput.value = savedMd;
    if (savedAutoRun !== null) autoRun.checked = savedAutoRun === 'true';
    if (savedIncludeTailwind !== null) includeTailwind.checked = savedIncludeTailwind === 'true';

    function makeId() { return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
    function createProject(o = {}) { return { id: makeId(), name: o.name || DEFAULT_PROJECT.name, html: o.html !== undefined ? o.html : DEFAULT_PROJECT.html, css: o.css !== undefined ? o.css : DEFAULT_PROJECT.css, js: o.js !== undefined ? o.js : DEFAULT_PROJECT.js, updatedAt: Date.now() }; }
    function loadProjects() { try { const raw = localStorage.getItem(STORAGE_KEYS.projects); if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed) && parsed.length > 0) return parsed; } } catch (e) {} return [createProject({ name: 'Scratch' })]; }
    function saveProjects() { localStorage.setItem(STORAGE_KEYS.projects, JSON.stringify(projects)); localStorage.setItem(STORAGE_KEYS.activeProjectId, activeProjectId); }
    function getActiveProject() { return projects.find((p) => p.id === activeProjectId) || projects[0]; }
    function captureEditorsToActiveProject() { const p = getActiveProject(); p.name = projectNameInput.value.trim() || 'Untitled'; p.html = htmlCode.value; p.css = cssCode.value; p.js = jsCode.value; p.updatedAt = Date.now(); saveProjects(); }
    function loadProjectIntoEditors(p) { activeProjectId = p.id; projectNameInput.value = p.name || 'Untitled'; htmlCode.value = p.html || ''; cssCode.value = p.css || ''; jsCode.value = p.js || ''; saveProjects(); renderProjectSelect(); }
    function renderProjectSelect() { projectSelect.innerHTML = ''; projects.slice().sort((a, b) => b.updatedAt - a.updatedAt).forEach((p) => { const option = document.createElement('option'); option.value = p.id; option.textContent = p.name || 'Untitled'; option.selected = p.id === activeProjectId; projectSelect.appendChild(option); }); }
    function notify(message) { clearTimeout(statusTimer); statusText.textContent = message; statusText.classList.remove('hidden'); statusTimer = setTimeout(() => statusText.classList.add('hidden'), 1800); }
    function applyEditorFontSize() { editorFontSize = Math.max(12, Math.min(24, editorFontSize)); allCodeTextareas.forEach((t) => { t.style.fontSize = editorFontSize + 'px'; }); localStorage.setItem(STORAGE_KEYS.editorFontSize, String(editorFontSize)); }
    function showMainTab(name) { const isPen = name === 'pen'; penTab.classList.toggle('hidden', !isPen); mdTab.classList.toggle('hidden', isPen); penButton.classList.toggle('bg-slate-600', isPen); mdButton.classList.toggle('bg-slate-600', !isPen); }
    function showEditorTab(name) { const isPreview = name === 'preview'; htmlCode.classList.toggle('hidden', name !== 'html'); cssCode.classList.toggle('hidden', name !== 'css'); jsCode.classList.toggle('hidden', name !== 'js'); editorPanel.classList.toggle('hidden', isPreview); previewPanel.classList.toggle('hidden', !isPreview); Object.keys(editorTabButtons).forEach((key) => { const active = key === name; editorTabButtons[key].classList.toggle('editor-tab-active', active); editorTabButtons[key].classList.toggle('editor-tab-inactive', !active); }); localStorage.setItem(STORAGE_KEYS.activeEditor, name); if (isPreview) runCode(false); }
    function formatConsoleArg(value) { if (typeof value === 'string') return value; try { return JSON.stringify(value, null, 2); } catch (e) { return String(value); } }
    function addConsoleLine(level, args) { const line = document.createElement('div'); line.className = 'console-line console-' + level; line.textContent = args.map(formatConsoleArg).join(' '); consoleOutput.appendChild(line); consoleOutput.scrollTop = consoleOutput.scrollHeight; }
    function clearConsole() { consoleOutput.innerHTML = ''; }
    function safeForScript(value) { return String(value).replace(/<\/script/gi, '<\\/script'); }
    function getConsoleBridgeScript() { return '<script>(function(){function s(level,args){window.parent.postMessage({type:"playground-console",level:level,args:Array.prototype.map.call(args,function(a){try{if(a instanceof Error)return a.stack||a.message;if(a instanceof HTMLElement)return a.outerHTML;if(typeof a==="function")return String(a);structuredClone(a);return a;}catch(e){try{return JSON.stringify(a);}catch(e2){return String(a);}}})},"*");}["log","warn","error"].forEach(function(level){var o=console[level];console[level]=function(){s(level,arguments);o.apply(console,arguments);};});window.addEventListener("error",function(e){s("error",[e.message+" at "+e.filename+":"+e.lineno]);});window.addEventListener("unhandledrejection",function(e){s("error",["Unhandled promise rejection",e.reason]);});})();<\/script>'; }
    function buildStandaloneDocument(withConsoleBridge) { const tailwindScript = includeTailwind.checked ? '<script src="https://cdn.tailwindcss.com"><\/script>' : ''; const bridge = withConsoleBridge ? getConsoleBridgeScript() : ''; return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' + tailwindScript + '\n<style>\n' + cssCode.value + '\n</style>\n</head>\n<body>\n' + htmlCode.value + '\n' + bridge + '\n<script>\ntry {\n' + safeForScript(jsCode.value) + '\n} catch (error) { console.error(error); }\n<\/script>\n</body>\n</html>'; }
    function runCode(switchToPreview) { captureEditorsToActiveProject(); localStorage.setItem(STORAGE_KEYS.autoRun, String(autoRun.checked)); localStorage.setItem(STORAGE_KEYS.includeTailwind, String(includeTailwind.checked)); clearConsole(); outputFrame.srcdoc = buildStandaloneDocument(true); if (switchToPreview) showEditorTab('preview'); }
    function debounce(fn, delay) { let timerId; return function () { const args = arguments; clearTimeout(timerId); timerId = setTimeout(() => fn.apply(null, args), delay); }; }
    const autoRunDebounced = debounce(() => { captureEditorsToActiveProject(); renderProjectSelect(); if (autoRun.checked) runCode(false); }, 500);
    async function copyStandaloneHtml() { captureEditorsToActiveProject(); try { await navigator.clipboard.writeText(buildStandaloneDocument(false)); notify('Standalone HTMLをコピーしました'); } catch (e) { notify('コピーできませんでした'); } }
    function exportStandaloneHtml() { captureEditorsToActiveProject(); const content = buildStandaloneDocument(false); const safeName = (getActiveProject().name || 'playground').trim().replace(/[\\/:*?\"<>|]/g, '-').replace(/\s+/g, '-').slice(0, 60) || 'playground'; const blob = new Blob([content], { type: 'text/html;charset=utf-8' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = safeName + '.html'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); notify('HTMLを書き出しました'); }
    async function renderMarkdown() { const source = mdInput.value; localStorage.setItem(STORAGE_KEYS.md, source); if (!window.marked || !window.hljs) { mdPreview.textContent = 'Markdownライブラリの読み込み中です。'; return; } mdPreview.innerHTML = marked.parse(source, { gfm: true, breaks: true }); mdPreview.querySelectorAll('pre code').forEach((code) => { const c = code.className || ''; if (c.includes('language-mermaid') || c.includes('lang-mermaid')) { const pre = code.parentElement; const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = code.textContent; pre.replaceWith(div); } }); mdPreview.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block)); if (window.mermaid) { try { await window.mermaid.run({ nodes: mdPreview.querySelectorAll('.mermaid') }); } catch (e) { const msg = document.createElement('div'); msg.className = 'my-3 rounded border border-red-300 bg-red-50 p-3 text-sm text-red-700'; msg.textContent = 'Mermaidの描画に失敗しました。構文を確認してください。'; mdPreview.prepend(msg); } } }

    penButton.addEventListener('click', () => showMainTab('pen'));
    mdButton.addEventListener('click', () => { showMainTab('md'); renderMarkdown(); });
    editorTabButtons.html.addEventListener('click', () => showEditorTab('html'));
    editorTabButtons.css.addEventListener('click', () => showEditorTab('css'));
    editorTabButtons.js.addEventListener('click', () => showEditorTab('js'));
    editorTabButtons.preview.addEventListener('click', () => showEditorTab('preview'));
    projectSelect.addEventListener('change', () => { captureEditorsToActiveProject(); const next = projects.find((p) => p.id === projectSelect.value); if (next) { loadProjectIntoEditors(next); notify('プロジェクトを切り替えました'); if (autoRun.checked) runCode(false); } });
    projectNameInput.addEventListener('input', debounce(() => { captureEditorsToActiveProject(); renderProjectSelect(); }, 300));
    newProjectButton.addEventListener('click', () => { captureEditorsToActiveProject(); const name = prompt('新しいプロジェクト名', 'Untitled'); if (name === null) return; const p = createProject({ name: name.trim() || 'Untitled', html: '', css: '', js: '' }); projects.push(p); loadProjectIntoEditors(p); showEditorTab('html'); notify('新規プロジェクトを作成しました'); });
    saveProjectButton.addEventListener('click', () => { captureEditorsToActiveProject(); renderProjectSelect(); notify('保存しました'); });
    deleteProjectButton.addEventListener('click', () => { if (projects.length <= 1) { notify('最後のプロジェクトは削除できません'); return; } const p = getActiveProject(); if (!confirm('「' + p.name + '」を削除しますか？')) return; projects = projects.filter((item) => item.id !== p.id); activeProjectId = projects[0].id; saveProjects(); loadProjectIntoEditors(projects[0]); notify('削除しました'); });
    resetSampleButton.addEventListener('click', () => { if (!confirm('現在のコードをサンプルに戻しますか？')) return; const p = getActiveProject(); p.html = DEFAULT_PROJECT.html; p.css = DEFAULT_PROJECT.css; p.js = DEFAULT_PROJECT.js; p.updatedAt = Date.now(); saveProjects(); loadProjectIntoEditors(p); showEditorTab('html'); if (autoRun.checked) runCode(false); notify('サンプルを読み込みました'); });
    copyHtmlButton.addEventListener('click', copyStandaloneHtml);
    exportHtmlButton.addEventListener('click', exportStandaloneHtml);
    fontSmallerButton.addEventListener('click', () => { editorFontSize -= 1; applyEditorFontSize(); notify('フォント ' + editorFontSize + 'px'); });
    fontLargerButton.addEventListener('click', () => { editorFontSize += 1; applyEditorFontSize(); notify('フォント ' + editorFontSize + 'px'); });
    runButton.addEventListener('click', () => runCode(true));
    clearConsoleButton.addEventListener('click', clearConsole);
    allCodeTextareas.forEach((textarea) => textarea.addEventListener('input', autoRunDebounced));
    autoRun.addEventListener('change', () => { localStorage.setItem(STORAGE_KEYS.autoRun, String(autoRun.checked)); if (autoRun.checked) runCode(false); });
    includeTailwind.addEventListener('change', () => { localStorage.setItem(STORAGE_KEYS.includeTailwind, String(includeTailwind.checked)); runCode(false); });
    mdInput.addEventListener('input', debounce(renderMarkdown, 250));
    window.addEventListener('message', (event) => { if (!event.data || event.data.type !== 'playground-console') return; addConsoleLine(event.data.level || 'log', event.data.args || []); });
    window.addEventListener('mermaid-ready', renderMarkdown);

    renderProjectSelect();
    loadProjectIntoEditors(getActiveProject());
    applyEditorFontSize();
    showMainTab('pen');
    showEditorTab(savedActiveEditor || 'html');
    runCode(false);
    renderMarkdown();
  </script>
</body>
</html>
